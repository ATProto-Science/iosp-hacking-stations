<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root { --fire:#E8651A; --spark:#F5A623; --smoke:#B7ADA3; --night:#141210; --ground:#221E1A; --log:#3A3028; --ash:#EDE8E2; }
    body { margin: 0; background: var(--night); color: var(--ash); font-family: "IBM Plex Sans", system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", monospace; }
  </style>
</helmet>

<div style="width:420px; height:500px; box-sizing:border-box; padding:20px; display:flex; flex-direction:column; gap:12px;">

  <div style="display:flex; align-items:center; gap:10px;">
    <span style="font-size:26px;">🌡️🧭💧🌦️🖥️🏓⏱️</span>
    <div>
      <div style="font-size:16px; font-weight:700;">sensor readings</div>
      <div class="mono" style="font-size:11px; color:var(--smoke);">style.tilde.hacking.sensorReading</div>
    </div>
  </div>

  <div class="mono" style="display:inline-block; align-self:flex-start; font-size:11px; color:var(--spark); border:1px solid var(--spark); border-radius:999px; padding:3px 10px;">tier: item</div>

  <div style="flex:1; border:2px dashed var(--log); border-radius:10px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;">
    <div class="mono" style="font-size:13px; color:var(--smoke);">item behavior TBD, per sensorType<br><br>busiest lane: ~72&ndash;120/min combined (3&ndash;5 boards)<br><br>open idea: an item colliding with an avatar (e.g. 🌡️ &times; 🐕) &mdash; see the sticky note above</div>
  </div>

</div>
</x-dc>
</body>
</html>
